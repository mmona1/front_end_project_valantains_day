<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Poojitheeee 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    .heart {
      position: absolute;
      animation: float 6s linear infinite;
      font-size: 22px;
      opacity: 0.8;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body class="bg-pink-100 overflow-hidden flex items-center justify-center h-screen">

  <!-- Floating Hearts -->
  <div id="hearts"></div>

  <!-- Main Card -->
  <div class="bg-white p-8 rounded-3xl shadow-2xl text-center w-[90%] max-w-md z-10">
    
    <!-- Cute GIF -->
    <img 
      src="https://media.giphy.com/media/l4FGpPki5v2Bcd6Ss/giphy.gif"
      alt="Cute Love"
      class="w-48 mx-auto mb-4 rounded-xl"
    />

    <h1 class="text-3xl font-bold text-pink-600 mb-2">
      Poojitheeee 💕
    </h1>

    <p class="text-lg mb-6">
      Ente heart fullaayi parayunnu 😌💓 <br>
      <span class="font-semibold">
        Will you be mine forever?
      </span> 💍
    </p>

    <div class="flex justify-center gap-6">
      <button
        onclick="yesClicked()"
        class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-2 rounded-full text-lg transition">
        Yes 😍
      </button>

      <button
        id="noBtn"
        onmouseover="moveNo()"
        class="bg-gray-300 text-gray-700 px-6 py-2 rounded-full text-lg cursor-not-allowed">
        No 🙈
      </button>
    </div>

    <p id="message" class="mt-6 text-lg text-pink-600 font-semibold hidden"></p>
  </div>

  <script>
    // Floating hearts
    const heartsContainer = document.getElementById("hearts");

    setInterval(() => {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 3 + "s";
      heartsContainer.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 300);

    // YES click
    function yesClicked() {
      const msg = document.getElementById("message");
      msg.innerHTML = "Awww 😍💖<br>Poojitheeee is mine forever 🥹💍";
      msg.classList.remove("hidden");

      // Confetti blast 🎉
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    // NO button escape 😏
    function moveNo() {
      const noBtn = document.getElementById("noBtn");
      const x = Math.random() * 250 - 125;
      const y = Math.random() * 250 - 125;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
